name: CI

on:
  push:
  pull_request:

permissions:
  checks: write
  id-token: write # needed for npm publish with provenance
  contents: write # needed for github release
  pull-requests: write # needed for coverage comment


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup and Install
        id: install
        uses: zirkelc/setup-and-install@v1

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      - name: Setup and Install
        id: install
        uses: zirkelc/setup-and-install@v1
        with:
          node-version: 20

      # Pinned to the last release that starts without an account. Newer images
      # require a LOCALSTACK_AUTH_TOKEN, which fork pull requests cannot access.
      # Started with plain Docker so the CLI's license check is never involved.
      - name: Start LocalStack
        env:
          LOCALSTACK_IMAGE: localstack/localstack:4.4.0
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$LOCALSTACK_IMAGE"

          echo "Waiting for LocalStack startup..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null; then
              echo "Startup complete"
              exit 0
            fi
            sleep 2
          done

          echo "LocalStack failed to become ready"
          docker logs localstack
          exit 1

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup and Install
        id: install
        uses: zirkelc/setup-and-install@v1

      - name: Build
        run: pnpm build

      # Trusted publishing needs npm >= 11.5.1. Older versions fall back to
      # token auth silently, which surfaces as a confusing 404 on publish.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      # No token: authentication happens over OIDC using the id-token
      # permission granted at the top of this workflow.
      - name: Publish to NPM
        id: publish
        uses: JS-DevTools/npm-publish@v3
        with:
          dry-run: false
          provenance: true

      - name: Post publish
        if: steps.publish.outputs.type != ''
        run: |
          echo "Published ${{ steps.publish.outputs.type }} version: ${{ steps.publish.outputs.version }}"

      - name: Publish skipped
        if: steps.publish.outputs.type == ''
        run: |
          echo "Version in package.json has not changed. Skipping."
          exit 0

      - name: Create Release
        if: steps.publish.outputs.type != ''
        id: release
        uses: ncipollo/release-action@v1 # https://github.com/ncipollo/release-action
        with:
          allowUpdates: true
          generateReleaseNotes: true
          commit: ${{ github.sha }}
          draft: false
          name: v${{ steps.publish.outputs.version }}
          tag: v${{ steps.publish.outputs.version }}
